import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
allprojects { project ->
    afterEvaluate {
        if (project.path == ':app') {
            tasks.register('auditRuntimeInventory') {
                doLast {
                    def entries = configurations.getByName(project.findProperty("auditConfiguration") ?: "debugRuntimeClasspath").incoming.resolutionResult.allComponents.collect { c ->
                        def id = c.id
                        id instanceof ModuleComponentIdentifier ? [group:id.group, name:id.module, version:id.version] : null
                    }.findAll { it != null }.sort { a,b -> (a.group+':'+a.name) <=> (b.group+':'+b.name) }
                    new File(project.rootDir, 'audit/' + (project.findProperty("auditOutput") ?: 'runtime-dependencies.json')).text = JsonOutput.prettyPrint(JsonOutput.toJson(entries))
                    println "Audited runtime modules: ${entries.size()}"
                }
            }
        }
    }
}
