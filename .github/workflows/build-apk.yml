name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install pinned Android SDK tools and platform
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_USER_HOME"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/android-tools.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          python3 -c 'print("y\n"*100)' > "$RUNNER_TEMP/license-answers"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < "$RUNNER_TEMP/license-answers"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build installable debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Unit tests and Android lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon
      - name: Verify standalone APK signature, integrity, permissions and 16 KB alignment
        run: python3 tools/verify_apk.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: SamsungUniversalRemote-APK
          path: app/build/outputs/delivery/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: Android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
